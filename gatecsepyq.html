<style>
:root{--bg:#080b11;--panel:#10151f;--panel2:#151b27;--line:#263142;--text:#eef3f8;--muted:#8f9caf;--accent:#65e6ff;--accent2:#8d7cff;--good:#42df88;--danger:#ff6573;--warn:#e7c76a;--shadow:0 16px 44px rgba(0,0,0,.33)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(1000px 520px at 72% -12%,#17273e 0%,transparent 65%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{min-height:100vh}
.topbar{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:30;background:rgba(8,11,17,.86);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#061017;font-weight:900;box-shadow:0 10px 28px rgba(101,230,255,.18);flex:0 0 auto}
.brandText{min-width:0}.brandTitle{font-size:15px;font-weight:900;letter-spacing:.65px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandSub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}
.topActions{display:flex;align-items:center;gap:7px;margin-left:12px}.toolBtn{border:1px solid var(--line);background:#111823;color:var(--text);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:800}.toolBtn:hover{background:#182231;border-color:#3c5368}
.analysis{width:285px;background:linear-gradient(180deg,rgba(18,24,35,.97),rgba(13,18,28,.97));border:1px solid var(--line);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow);margin-left:10px}
.analysisHead{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#7f8da3}.analysisNum{font-size:11px;color:var(--muted)}
.analysisGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}.metric b{display:block;font-size:16px;line-height:1}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:8px}
.bar{height:5px;background:#1c2532;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.25s}
.body{display:grid;grid-template-columns:315px minmax(0,1fr);min-height:calc(100vh - 82px)}
.sidebar{border-right:1px solid var(--line);padding:12px;position:sticky;top:82px;height:calc(100vh - 82px);overflow:auto;background:rgba(8,11,17,.45)}
.sideTitle{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#68758a;margin:6px 8px 9px}.subjectList{display:grid;gap:5px}
.subjectBtn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px;border-radius:11px;display:flex;align-items:center;gap:9px;text-align:left;transition:.15s}
.subjectBtn:hover{background:var(--panel);color:var(--text);border-color:var(--line)}.subjectBtn.active{background:linear-gradient(180deg,#151d2a,#111824);color:var(--text);border-color:#324255}

.chapterBox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.chapterList{display:grid;gap:4px}
.chapterBtn{width:100%;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 8px;border-radius:10px;text-align:left}
.chapterBtn:hover{background:var(--panel);color:var(--text);border-color:var(--line)}.chapterBtn.active{background:linear-gradient(180deg,#151d2a,#111824);color:var(--text);border-color:#324255}
.chapterNo{width:25px;height:25px;border-radius:8px;background:#1b2433;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}.chapterBtn.active .chapterNo{background:linear-gradient(135deg,#214555,#3d2e61);color:var(--accent)}

.sideTools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.sideTool{border:1px solid var(--line);background:#101722;color:var(--muted);border-radius:9px;padding:8px 6px;font-size:9px;font-weight:800}.sideTool:hover{color:var(--text);background:#151d2a}
.content{padding:24px 28px 48px;min-width:0}.sectionHead{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}.sectionHead h1{font-size:24px;margin:0}.sectionMeta{font-size:10px;color:var(--muted);margin-top:4px}.topicProgress{margin-left:auto;min-width:190px}
.topicProgressTop{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:6px}.localBar{height:5px;background:#1c2532;border-radius:99px;overflow:hidden}.localBar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.25s}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.search{flex:1 1 280px;min-width:180px;border:1px solid var(--line);background:#0e141d;color:var(--text);border-radius:10px;padding:9px 11px;outline:none;font-size:11px}.search:focus{border-color:#3a5a71}

try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved,completed:saved.completed||{}}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function subject(){return SUBJECTS.find(s=>s.id===state.subject)||SUBJECTS[0]}
function chapter(){return subject().chapters.find(c=>c.id===state.chapter)||subject().chapters[0]}
function qKey(s,q){return s.id+'::'+q.id}
function videos(s){return s.questions.filter(q=>q.url)}
function watched(s){return s.questions.filter(q=>state.completed[qKey(s,q)])}
function pct(a,b){return b?Math.round(a/b*100):0}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderSubjects(){const el=document.getElementById('subjects');el.innerHTML=SUBJECTS.map(s=>{const done=watched(s).length;return `<button class="subjectBtn ${s.id===state.subject?'active':''}" onclick="selectSubject('${s.id}')"><span class="subjectDot" style="color:${s.color};background:${s.color}"></span><span class="subjectName">${esc(s.name)}</span><span class="subjectCount">${done}/${s.questions.length}</span></button>`}).join('')}
function renderChapters(){const s=subject();if(!s.chapters.some(c=>c.id===state.chapter))state.chapter=s.chapters[0].id;document.getElementById('chapterLabel').textContent=s.name+' • Chapters';document.getElementById('chapters').innerHTML=s.chapters.map(c=>{const qs=s.questions.filter(q=>q.chapter===c.id),done=qs.filter(q=>state.completed[qKey(s,q)]).length;return `<button class="chapterBtn ${c.id===state.chapter?'active':''}" onclick="selectChapter(${c.id})"><span class="chapterNo">${c.id}</span><span class="chapterName">${esc(c.name)}</span><span class="chapterDone ${done===qs.length?'good':''}">${done}/${qs.length}</span></button>`}).join('')}
function renderAnalysis(){const s=subject(),qs=s.questions,done=watched(s).length,vids=videos(s).length,c=chapter(),cqs=qs.filter(q=>q.chapter===c.id),cd=cqs.filter(q=>state.completed[qKey(s,q)]).length,total=SUBJECTS.reduce((a,x)=>a+x.questions.length,0),doneAll=SUBJECTS.reduce((a,x)=>a+watched(x).length,0),videoAll=SUBJECTS.reduce((a,x)=>a+videos(x).length,0),missingAll=total-videoAll;document.getElementById('analysis').innerHTML=`<div class="analysisHead"><span>Master Analysis</span><span class="analysisNum">${doneAll}/${total}</span></div><div class="analysisGrid"><div class="metric"><b>${doneAll}</b><span>Watched</span></div><div class="metric"><b>${total-doneAll}</b><span>Pending</span></div><div class="metric"><b>${videoAll}</b><span>Videos</span></div><div class="metric"><b>${pct(doneAll,total)}%</b><span>Overall</span></div></div><div class="bar"><i style="width:${pct(doneAll,total)}%"></i></div>`;document.getElementById('chapterPct').textContent=pct(cd,cqs.length)+'%';document.getElementById('chapterBar').style.width=pct(cd,cqs.length)+'%';document.getElementById('sectionTitle').textContent=s.name;document.getElementById('sectionMeta').textContent=`${s.questions.length} question slots • ${vids} video solutions • ${s.chapters.length} chapters`;document.getElementById('footer').textContent=`${total-doneAll} question slots pending across all subjects • ${missingAll} source slots have no usable video URL.`}
function renderGrid(){const s=subject(),c=chapter(),search=document.getElementById('search').value.trim().toLowerCase();let qs=s.questions.filter(q=>q.chapter===c.id).filter(q=>{const done=!!state.completed[qKey(s,q)];if(state.filter==='pending'&&done)return false;if(state.filter==='done'&&!done)return false;if(state.filter==='missing'&&q.url)return false;if(search&&!`${q.q} video solution ${c.name} ${s.name}`.toLowerCase().includes(search))return false;return true});if(document.getElementById('sort').value==='desc')qs.reverse();const grid=document.getElementById('grid');if(!qs.length){grid.innerHTML='<div class="empty">No matching video solutions.</div>';return}grid.innerHTML=qs.map(q=>{const done=!!state.completed[qKey(s,q)],n=String(q.q).padStart(2,'0');if(!q.url)return `<div class="videoBtn disabled"><div class="videoTop"><span class="play">—</span><span class="qnum">Video Solution ${n}</span><span class="check">•</span></div><span class="disabledText missingBadge">No usable video URL in source app</span></div>`;return `<a class="videoBtn ${done?'done':''}" href="${q.url}" target="_blank" rel="noopener noreferrer" onclick="markWatched('${s.id}','${q.id}')"><div class="videoTop"><span class="play">▶</span><span class="qnum">Video Solution ${n}</span><span class="check">${done?'✓':''}</span></div><span class="disabledText">${done?'Watched • click to replay':'Open Video Solution'}</span></a>`}).join('')}
function render(){renderSubjects();renderChapters();renderAnalysis();renderGrid();document.title=`GATE CSE — ${subject().name} Video Solutions`}
function selectSubject(id){state.subject=id;state.chapter=SUBJECTS.find(s=>s.id===id).chapters[0].id;state.filter='all';document.getElementById('search').value='';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function selectChapter(id){state.chapter=id;save();render();document.querySelector('.content').scrollIntoView({behavior:'smooth',block:'start'})}
function setFilter(f){state.filter=f;document.querySelectorAll('.filterBtn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));renderGrid()}
function markWatched(sid,qid){const s=SUBJECTS.find(x=>x.id===sid),q=s.questions.find(x=>x.id===qid);if(!q||!q.url)return;state.completed[qKey(s,q)]=true;save();renderSubjects();renderChapters();renderAnalysis();renderGrid()}
function markAllVisible(){const s=subject(),c=chapter(),search=document.getElementById('search').value.trim().toLowerCase();s.questions.filter(q=>q.chapter===c.id&&q.url).forEach(q=>{const done=!!state.completed[qKey(s,q)];if(state.filter==='done'&&!done)return;if(state.filter==='pending'&&done)return;if(state.filter==='missing')return;if(search&&!`${q.q} video solution ${c.name} ${s.name}`.toLowerCase().includes(search))return;state.completed[qKey(s,q)]=true});save();render();toast('Visible video solutions marked watched')}
function resetCurrent(){const s=subject();if(!confirm(`Reset watched progress for ${s.name}?`))return;s.questions.forEach(q=>delete state.completed[qKey(s,q)]);save();render();toast('Subject progress reset')}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'GATE CSE Master Video Solution Tracker',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GATE_CSE_Master_Video_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported')}
function importProgress(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj.state||!obj.state.completed)throw 0;state={...state,...obj.state,completed:obj.state.completed||{}};save();render();toast('Progress imported')}catch(e){alert('Invalid progress backup file.')}ev.target.value=''};r.readAsText(file)}
function openBackup(){document.getElementById('modal').innerHTML=`<h2>Backup / Restore</h2><p>Watched progress is saved locally in this browser. Export a JSON backup to move it to another PC or mobile browser.</p><div class="modalActions"><button class="modalBtn" onclick="closeModal()">Close</button><button class="modalBtn primary" onclick="exportProgress();closeModal()">Export Progress</button><button class="modalBtn" onclick="document.getElementById('importFile').click();closeModal()">Import Progress</button></div>`;document.getElementById('modalBack').style.display='flex'}
function closeModal(e){if(e&&e.target!==document.getElementById('modalBack'))return;document.getElementById('modalBack').style.display='none'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalBack').style.display='none';if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search').focus()}})
render();
</script>
</body>
</html>
