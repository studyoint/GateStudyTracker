<style id="rn-next-level-css">
/* ===== RN NEXT-LEVEL LAYER — non-destructive upgrade ===== */
:root{
  --rn-bg:#070a10;--rn-surface:rgba(13,18,27,.88);--rn-surface2:rgba(18,25,37,.94);
  --rn-line:rgba(116,145,176,.22);--rn-text:#edf5ff;--rn-muted:#8fa1b7;
  --rn-cyan:#61e8ff;--rn-blue:#5c8dff;--rn-green:#42df88;--rn-shadow:0 18px 60px rgba(0,0,0,.34);
  --rn-radius:16px;
}
html{scroll-behavior:smooth}
body{background:
  radial-gradient(900px 500px at 85% -10%,rgba(68,117,255,.16),transparent 60%),
  radial-gradient(700px 450px at 5% 18%,rgba(0,220,255,.07),transparent 62%),
  var(--rn-bg)!important;
  color:var(--rn-text);
  overflow-x:hidden;
}
body.rn-compact header{transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,0,0,.24)}
header{
  position:relative!important;
  z-index:20!important;
  border-bottom:1px solid var(--rn-line);
  backdrop-filter:blur(16px);
  background:linear-gradient(180deg,rgba(7,10,16,.94),rgba(7,10,16,.78))!important;
  transition:.25s ease;
}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--rn-cyan),transparent);opacity:.35}
#mainHeading{margin-bottom:8px}
#quoteContainer{
  max-width:min(900px,94vw)!important;
  margin:10px auto!important;
  border:1px solid var(--rn-line)!important;
  background:linear-gradient(135deg,rgba(16,28,42,.82),rgba(10,15,24,.82))!important;
  box-shadow:var(--rn-shadow);
  border-radius:var(--rn-radius)!important;
  padding:12px 16px!important;
}
.countdown-container{
  border:1px solid var(--rn-line)!important;
  background:rgba(10,15,23,.76)!important;
  border-radius:12px!important;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.search-section{
  position:sticky!important;top:0;z-index:12;
  padding:12px max(14px,3vw)!important;
  background:rgba(7,10,16,.76)!important;
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(116,145,176,.12);
}
.search-bar{
  width:min(100%,900px)!important;
  margin:auto!important;
  min-height:46px!important;
  border:1px solid var(--rn-line)!important;
  border-radius:14px!important;
  background:rgba(13,19,29,.92)!important;
  color:var(--rn-text)!important;
  box-shadow:0 10px 32px rgba(0,0,0,.18);
  padding-left:16px!important;
  outline:none!important;
}
.search-bar:focus{border-color:rgba(97,232,255,.65)!important;box-shadow:0 0 0 3px rgba(97,232,255,.08),0 12px 34px rgba(0,0,0,.22)}
.filter-section{
  display:flex!important;flex-wrap:wrap!important;gap:8px!important;
  align-items:center;justify-content:center;
  padding:12px max(12px,2.5vw)!important;
  max-width:1500px;margin:auto!important;
}
.filter-section>a,.filter-section>button{flex:0 0 auto}
.filter-btn{
  min-height:38px!important;
  border:1px solid var(--rn-line)!important;
  background:linear-gradient(180deg,rgba(20,28,41,.92),rgba(13,19,28,.92))!important;
  color:#b9c7d8!important;
  border-radius:11px!important;
  padding:8px 12px!important;
  font-weight:750!important;
  transition:transform .16s,border-color .16s,background .16s,box-shadow .16s!important;
}
.filter-btn:hover{transform:translateY(-1px);border-color:rgba(97,232,255,.45)!important;color:#fff!important;box-shadow:0 7px 22px rgba(0,0,0,.2)}
.filter-btn.active{border-color:rgba(97,232,255,.58)!important;background:linear-gradient(135deg,rgba(22,59,74,.95),rgba(34,37,76,.95))!important;color:#fff!important;box-shadow:0 0 0 1px rgba(97,232,255,.08) inset}
.overall-progress-section{
  max-width:1500px!important;margin:10px auto 18px!important;
  border:1px solid var(--rn-line)!important;
  border-radius:18px!important;
  background:linear-gradient(145deg,rgba(15,23,35,.76),rgba(9,14,22,.76))!important;
  box-shadow:var(--rn-shadow);
}
#overallProgressPercent{font-weight:900!important;text-shadow:0 0 16px rgba(97,232,255,.35)}
.subjects-section{
  width:min(1500px,94vw)!important;margin:0 auto 28px!important;
  display:grid!important;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr))!important;
  gap:14px!important;
}
.subjects-section>*{
  min-width:0;
  transition:transform .18s ease,filter .18s ease;
}
.subjects-section>*:hover{transform:translateY(-3px);filter:brightness(1.04)}
.footer_style{
  border-top:1px solid var(--rn-line)!important;
  background:rgba(6,9,14,.72)!important;
  backdrop-filter:blur(12px);
  padding:18px 12px!important;
}
.rn-mobile-tools{
  display:none;
}
.rn-top{
  position:fixed;right:16px;bottom:18px;z-index:60;
  width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(97,232,255,.38);
  background:rgba(10,16,25,.92);color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.35);
  cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);
  transition:.2s;font-size:18px;
}
.rn-top.show{opacity:1;pointer-events:auto;transform:none}
.rn-status{
  position:fixed;left:14px;bottom:16px;z-index:59;
  padding:8px 11px;border-radius:10px;
  border:1px solid var(--rn-line);background:rgba(10,15,23,.9);
  color:#aebed0;font-size:10px;backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,0,0,.24);
}
.rn-status b{color:var(--rn-cyan)}
.rn-theme{
  position:fixed;right:16px;top:16px;z-index:70;
  border:1px solid var(--rn-line);background:rgba(10,15,23,.82);
  color:#dbe8f6;border-radius:10px;padding:7px 9px;cursor:pointer;
  backdrop-filter:blur(10px)
}
body.rn-light{
  --rn-bg:#eef3f8;--rn-surface:rgba(255,255,255,.92);--rn-surface2:#fff;
  --rn-text:#102033;--rn-muted:#52667b;--rn-line:rgba(37,61,86,.18);
  background:linear-gradient(145deg,#edf4fb,#dfeaf5)!important;color:var(--rn-text)!important;
}
body.rn-light header,.rn-light .search-section{background:rgba(239,245,250,.88)!important}
body.rn-light .search-bar{background:#fff!important;color:#102033!important}
body.rn-light .filter-btn{background:#fff!important;color:#30465d!important}
body.rn-light .overall-progress-section{background:rgba(255,255,255,.8)!important}
@media(max-width:800px){
  .rn-theme{top:8px;right:8px}
  header{padding:16px 10px!important}
  #mainHeading{font-size:clamp(21px,7vw,32px)!important;line-height:1.12}
  #quoteContainer{margin:8px auto!important;padding:10px 12px!important}
  .search-section{padding:9px 10px!important}
  .search-bar{min-height:44px!important}
  .filter-section{justify-content:flex-start!important;overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none;padding:8px 10px!important}
  .filter-section::-webkit-scrollbar{display:none}
  .filter-btn{white-space:nowrap!important;min-height:36px!important;padding:7px 10px!important;font-size:11px!important}
  .overall-progress-section{width:calc(100% - 20px)!important;margin:10px auto!important;padding:12px!important}
  .subjects-section{width:calc(100% - 20px)!important;grid-template-columns:1fr!important;gap:10px!important}
  .footer_style{font-size:10px!important}
  .rn-status{bottom:10px;left:10px}
  .rn-top{bottom:10px;right:10px}
}
@media(min-width:801px) and (max-width:1100px){
  .subjects-section{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>

<script id="rn-next-level-js">
(function(){
  'use strict';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const status=$('#rnStatus'), topBtn=$('#rnTop'), theme=$('#rnTheme');
  const key='rn_gate_main_theme_v2';

  function setStatus(msg){
    if(status) status.innerHTML=msg;
  }

  // Theme preference — does not touch the existing tracker state.
  try{
    const saved=localStorage.getItem(key);
    if(saved==='light') document.body.classList.add('rn-light');
  }catch(e){}
  function updateThemeIcon(){
    if(theme) theme.textContent=document.body.classList.contains('rn-light')?'☀':'☾';
  }
  updateThemeIcon();
  theme?.addEventListener('click',()=>{
    document.body.classList.toggle('rn-light');
    try{localStorage.setItem(key,document.body.classList.contains('rn-light')?'light':'dark')}catch(e){}
    updateThemeIcon();
  });

  // Back-to-top + compact header state.
  function scrollUI(){
    const y=window.scrollY||0;
    document.body.classList.toggle('rn-compact',y>80);
    topBtn?.classList.toggle('show',y>500);
  }
  window.addEventListener('scroll',scrollUI,{passive:true});
  scrollUI();
  topBtn?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

  // Better search UX without replacing the original search logic.
  const search=$('#searchInput');
  if(search){
    search.setAttribute('autocomplete','off');
    search.setAttribute('aria-label','Search subjects, lectures, PYQs and tasks');
    const wrap=search.parentElement;
    if(wrap && !$('#rnClearSearch')){
      const b=document.createElement('button');
      b.id='rnClearSearch'; b.type='button'; b.textContent='×';
      b.title='Clear search';
      Object.assign(b.style,{
        position:'absolute',right:'max(22px,calc((100vw - 900px)/2 + 10px))',
        top:'50%',transform:'translateY(-50%)',border:'0',
        background:'transparent',color:'#8fa1b7',fontSize:'22px',
        cursor:'pointer',display:'none',padding:'2px 8px',zIndex:'2'
      });
      if(getComputedStyle(wrap).position==='static') wrap.style.position='relative';
      wrap.appendChild(b);
      const sync=()=>b.style.display=search.value?'block':'none';
      search.addEventListener('input',sync); b.addEventListener('click',()=>{search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));search.focus()}); sync();
    }
  }

  // Password popup: Enter key works, and password input receives focus.
  const pass=$('#sitePassword'), unlock=$('#unlockBtn');
  if(pass && unlock){
    pass.addEventListener('keydown',e=>{if(e.key==='Enter')unlock.click()});
    setTimeout(()=>{if($('#passwordPopup')?.style.display!=='none')pass.focus()},120);
  }

  // Keyboard shortcuts. They coexist with the existing app.
  document.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
    if(e.key==='/' || (e.ctrlKey && e.key.toLowerCase()==='k')){
      e.preventDefault(); search?.focus(); search?.select();
    }
    if(e.key==='Home' && !e.ctrlKey){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}
  });

  // Dynamic status: report visible subject-card count after the original script renders.
  function inspect(){
    const cards=$$('#subjectsContainer > *');
    if(cards.length) setStatus(`${cards.length} subjects loaded • <b>Live</b>`);
  }
  const target=$('#subjectsContainer');
  if(target){
    new MutationObserver(inspect).observe(target,{childList:true,subtree:true});
    setTimeout(inspect,500);
  }

  // Make anchor/button combinations accessible without changing their destinations.
  $$('a').forEach(a=>{
    const b=a.querySelector('button');
    if(b) a.setAttribute('aria-label',b.textContent.trim());
  });

  // Prevent accidental double-submit behavior on touch devices.
  $$('button').forEach(b=>b.addEventListener('touchstart',()=>{}, {passive:true}));

  setStatus('Ready • <b>GATE CSE</b>');
})();
</script>
